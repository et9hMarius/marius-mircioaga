<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark light" />
    <meta name="author" content="Marius Mircioaga" />

    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="48x48 32x32 16x16" />
    <link rel="icon" type="image/png" sizes="512x512" href="%PUBLIC_URL%/images/logo.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="Marius Mircioaga — Articles"
      href="%PUBLIC_URL%/feed.xml"
    />

    <!--
      Route-specific head tags (title, description, canonical, Open Graph,
      Twitter card, JSON-LD) come from src/components/seo.jsx, fed by
      src/seo.js. The prerender step (scripts/prerender.mjs) writes them into
      each page in place of this fallback <title>.
    -->
    <title>Marius Mircioaga — Full-stack &amp; AI integration developer | Founder, ARCHDEVS</title>

    <!-- Apply the saved theme before first paint, so prerendered pages don't flash dark. -->
    <script>
      try {
        var theme = localStorage.getItem("theme");
        if (theme) document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
