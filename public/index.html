<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="author" content="Marius Mircioaga" />

    <!--
      Route-specific tags (title, description, canonical, og:title,
      og:description, og:url) come from src/components/seo.jsx. The prerender
      step (scripts/prerender.mjs) writes them into each page in place of
      this fallback <title>.
    -->
    <title>Marius Mircioaga — Full-stack &amp; AI integration developer | Founder, ARCHDEVS</title>

    <meta property="og:site_name" content="Marius Mircioaga" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://mariusmircioaga.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Apply the saved theme before first paint, so prerendered pages don't flash dark. -->
    <script>
      try {
        var theme = localStorage.getItem("theme");
        if (theme) document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {}
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Marius Mircioaga",
        "jobTitle": "Founder & Lead Developer",
        "worksFor": {
          "@type": "Organization",
          "name": "ARCHDEVS SRL",
          "url": "https://archdevs.org"
        },
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Pitești",
          "addressCountry": "RO"
        },
        "url": "https://mariusmircioaga.com",
        "sameAs": [
          "https://www.linkedin.com/in/marius-mircioaga-b92307299/",
          "https://github.com/et9hMarius",
          "https://archdevs.org"
        ]
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
